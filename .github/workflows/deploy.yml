# ============================================================
# CD — Deploy otomatis ke server via SSH + rsync
#
# !! SEMENTARA DINONAKTIFKAN (di-comment) !!
# Untuk menyalakan lagi: hapus tanda "#" di semua baris di bawah.
# Setelah itu workflow "Deploy" akan berjalan SETELAH workflow
# "CI" sukses di branch main.
#
# Secrets yang harus di-set di repo (Settings → Secrets and variables → Actions):
#   SSH_HOST     — IP/hostname server (mis. 203.0.113.10)
#   SSH_USER     — user SSH (mis. deploy)
#   SSH_KEY      — isi private key (rsa/ed25519) — public key harus ada di server
#   SSH_PORT     — port SSH, default 22 (opsional)
#   REMOTE_PATH  — path absolut app di server (mis. /var/www/kue-pandan-sby)
#
# Server-side requirements (sekali setup):
#   composer, php >= 8.1 (dengan ext pdo_mysql, gd, mbstring, dom, zip, intl),
#   dan user SSH punya hak tulis pada REMOTE_PATH.
# ============================================================

